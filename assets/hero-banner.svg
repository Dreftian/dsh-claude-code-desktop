<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1E1C"/>
      <stop offset="50%" stop-color="#191918"/>
      <stop offset="100%" stop-color="#131312"/>
    </linearGradient>

    <radialGradient id="glow-terracotta" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#D97757" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#191918" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-bottom-left" cx="15%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#191918" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="subtle-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FAF9F5" stroke-opacity="0.03" stroke-width="1"/>
      <circle cx="32" cy="0" r="1" fill="#FAF9F5" fill-opacity="0.08"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="badge-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="star-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-ui { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-editorial { font-family: 'Newsreader', Georgia, 'Times New Roman', serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  </style>

  <!-- Base Canvas -->
  <rect width="1000" height="300" rx="16" fill="url(#bg-grad)"/>
  <rect width="1000" height="300" rx="16" fill="url(#glow-terracotta)"/>
  <rect width="1000" height="300" rx="16" fill="url(#glow-bottom-left)"/>
  <rect width="1000" height="300" rx="16" fill="url(#subtle-grid)"/>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="998" height="298" rx="15" fill="none" stroke="#FAF9F5" stroke-opacity="0.1" stroke-width="1.2"/>

  <!-- Decorative Claude Geometric Emblem (Right Side) -->
  <g transform="translate(820, 145)" opacity="0.85">
    <!-- Star Glow Backing -->
    <circle cx="0" cy="0" r="85" fill="#D97757" fill-opacity="0.07" filter="url(#star-glow)"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#D97757" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#FAF9F5" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Claude Star ✻ vector shape with 8 organic petals -->
    <g transform="scale(1.4)" fill="#D97757">
      <!-- Petals: 4 cardinal and 4 diagonal rounded spokes -->
      <rect x="-3" y="-36" width="6" height="72" rx="3"/>
      <rect x="-36" y="-3" width="72" height="6" rx="3"/>
      <rect x="-3" y="-36" width="6" height="72" rx="3" transform="rotate(45)"/>
      <rect x="-3" y="-36" width="6" height="72" rx="3" transform="rotate(-45)"/>
      <circle cx="0" cy="0" r="6.5" fill="#FAF9F5"/>
    </g>
    
    <!-- Accent floating dots -->
    <circle cx="-70" cy="-45" r="2.5" fill="#D97757" opacity="0.6"/>
    <circle cx="65" cy="55" r="2" fill="#FAF9F5" opacity="0.4"/>
    <circle cx="80" cy="-30" r="1.5" fill="#D97757" opacity="0.8"/>
  </g>

  <!-- Left Content Block -->
  <!-- Eyebrow Badge -->
  <g transform="translate(56, 42)">
    <rect width="286" height="28" rx="14" fill="#D97757" fill-opacity="0.12" stroke="#D97757" stroke-opacity="0.32" stroke-width="1"/>
    <!-- Mini star -->
    <text x="14" y="18" class="font-ui" font-size="14" font-weight="700" fill="#D97757">✻</text>
    <text x="32" y="18" class="font-mono" font-size="11" font-weight="600" fill="#E8967D" letter-spacing="0.06em">CORDIS PLUGIN FOR DEEPSEEK HARNESS</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(56, 116)">
    <text class="font-ui" font-size="34" font-weight="800" fill="#FAF9F5" letter-spacing="-0.03em">
      Claude Code Desktop GUI
      <tspan fill="#D97757"> for dsh</tspan>
    </text>
  </g>

  <!-- Subtitle with Editorial Typography -->
  <g transform="translate(56, 154)">
    <text class="font-editorial" font-size="20" font-style="italic" fill="#C4C0B5" letter-spacing="-0.01em">
      Transform dsh into an editorial desktop workstation with Cordis
    </text>
  </g>

  <!-- Decorative Separator Line -->
  <line x1="56" y1="182" x2="720" y2="182" stroke="#FAF9F5" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Bottom Feature Badges (Row of 4) -->
  <!-- Badge 1: Anthropic Dark & Paper Light -->
  <g transform="translate(56, 204)" filter="url(#badge-shadow)">
    <rect width="210" height="42" rx="10" fill="#21201E" stroke="#353430" stroke-width="1"/>
    <!-- Dual palette mini preview circle -->
    <g transform="translate(14, 13)">
      <circle cx="8" cy="8" r="8" fill="#141413" stroke="#45433F" stroke-width="1"/>
      <path d="M 8 0 A 8 8 0 0 1 8 16 Z" fill="#FAF9F5"/>
    </g>
    <text x="38" y="22" class="font-ui" font-size="12" font-weight="600" fill="#F4F3EE">Anthropic Dark</text>
    <text x="127" y="22" class="font-ui" font-size="12" font-weight="400" fill="#A39F95">&amp; Paper Light</text>
    <text x="38" y="34" class="font-mono" font-size="9" fill="#D97757">#191918 · #FAF9F5</text>
  </g>

  <!-- Badge 2: Plan Mode (Shift + Tab) -->
  <g transform="translate(280, 204)" filter="url(#badge-shadow)">
    <rect width="205" height="42" rx="10" fill="#21201E" stroke="#353430" stroke-width="1"/>
    <!-- Shield Icon -->
    <g transform="translate(14, 13)" stroke="#D97757" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 1 L 1 4 v 4 c 0 4.5 3 7.8 7 8.8 c 4 -1 7 -4.3 7 -8.8 V 4 Z"/>
      <path d="M 6 8.5 l 2 2 l 4 -4"/>
    </g>
    <text x="38" y="22" class="font-ui" font-size="12" font-weight="600" fill="#F4F3EE">Plan Mode</text>
    <rect x="105" y="11" width="84" height="15" rx="4" fill="#2A2926" stroke="#42403B" stroke-width="0.8"/>
    <text x="147" y="22" class="font-mono" font-size="9" font-weight="600" fill="#E8967D" text-anchor="middle">Shift + Tab</text>
    <text x="38" y="34" class="font-ui" font-size="9.5" fill="#A39F95">Interactive state toggle</text>
  </g>

  <!-- Badge 3: Live App Preview 460px -->
  <g transform="translate(499, 204)" filter="url(#badge-shadow)">
    <rect width="205" height="42" rx="10" fill="#21201E" stroke="#353430" stroke-width="1"/>
    <!-- Lightning Bolt Icon -->
    <g transform="translate(15, 13)" fill="#D97757">
      <path d="M 9 1 L 3 9 h 5 l -1 7 l 7 -9 h -5 Z"/>
    </g>
    <text x="38" y="22" class="font-ui" font-size="12" font-weight="600" fill="#F4F3EE">Live App Preview</text>
    <rect x="146" y="11" width="46" height="15" rx="4" fill="#2A2926" stroke="#42403B" stroke-width="0.8"/>
    <text x="169" y="22" class="font-mono" font-size="9" font-weight="600" fill="#E8967D" text-anchor="middle">460px</text>
    <text x="38" y="34" class="font-ui" font-size="9.5" fill="#A39F95">Slide-out web drawer</text>
  </g>

  <!-- Badge 4: Cordis Plugin -->
  <g transform="translate(718, 204)" filter="url(#badge-shadow)">
    <rect width="186" height="42" rx="10" fill="#21201E" stroke="#353430" stroke-width="1"/>
    <!-- Cordis Cube Icon -->
    <g transform="translate(15, 13)" stroke="#D97757" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 1 L 15 5 v 7 l -7 4 l -7 -4 V 5 Z"/>
      <path d="M 8 1 v 15"/>
      <path d="M 1 5 l 7 4 l 7 -4"/>
    </g>
    <text x="38" y="22" class="font-ui" font-size="12" font-weight="600" fill="#F4F3EE">Cordis Plugin</text>
    <text x="38" y="34" class="font-mono" font-size="9.5" fill="#A39F95">apply(ctx) lifecycle</text>
  </g>

</svg>
