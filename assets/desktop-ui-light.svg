<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" fill="none">
  <defs>
    <!-- Light Mode Shadows & Glows -->
    <filter id="win-shadow-light-native" x="-3%" y="-2%" width="106%" height="108%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#3D382E" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3D382E" flood-opacity="0.08"/>
    </filter>

    <filter id="composer-shadow-light" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#4A453A" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#D97757" flood-opacity="0.18"/>
    </filter>

    <filter id="star-glow-hero-light" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip path for the window -->
    <clipPath id="win-clip-light-native">
      <rect x="10" y="10" width="980" height="540" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .font-ui { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-editorial { font-family: 'Newsreader', Georgia, 'Times New Roman', serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  </style>

  <!-- Outside Canvas Backdrop (Warm Paper Gray) -->
  <rect width="1000" height="560" fill="#EDEAE2"/>

  <!-- Main Window Frame (Shadowed Container) -->
  <g filter="url(#win-shadow-light-native)">
    <rect x="10" y="10" width="980" height="540" rx="10" fill="#FAF9F5" stroke="#DCD8CD" stroke-width="1.2"/>
  </g>

  <!-- Window Contents (Clipped) -->
  <g clip-path="url(#win-clip-light-native)">

    <!-- ========================================================================= -->
    <!-- SLIM INTEGRATED TOP TITLEBAR -->
    <!-- ========================================================================= -->
    <rect x="10" y="10" width="980" height="42" fill="#EDEAE0" stroke="#DDD9CE" stroke-width="1"/>

    <!-- Left breadcrumb / environment chip -->
    <g transform="translate(24, 18)">
      <rect width="148" height="24" rx="6" fill="#E2DFD4" stroke="#D2CEC2" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="3" fill="#D97757"/>
      <text x="22" y="16" class="font-mono" font-size="10.5" fill="#5A564E">dsh · DeepSeek GUI</text>
    </g>

    <!-- Center Integrated Controls -->
    <!-- Segmented Control [Chat | Code] -->
    <g transform="translate(260, 18)">
      <rect width="136" height="26" rx="6" fill="#DDD9CE" stroke="#D0CBC0" stroke-width="1"/>
      <rect x="2" y="2" width="64" height="22" rx="5" fill="#FAF9F5" stroke="#C9C4B7" stroke-width="0.8"/>
      <text x="34" y="17" class="font-ui" font-size="11" font-weight="700" fill="#141413" text-anchor="middle">Chat</text>
      <text x="100" y="17" class="font-ui" font-size="11" font-weight="500" fill="#7A756D" text-anchor="middle">Code</text>
    </g>

    <!-- Action Pill 1: Plan Mode -->
    <g transform="translate(412, 18)">
      <rect width="124" height="25" rx="12.5" fill="#F6ECE7" stroke="#D97757" stroke-width="1.2"/>
      <text x="12" y="16" class="font-ui" font-size="11">🛡️</text>
      <text x="30" y="16" class="font-ui" font-size="10.5" font-weight="700" fill="#C66143">Plan Mode</text>
      <rect x="94" y="5" width="22" height="15" rx="3" fill="#EDD8CF"/>
      <text x="105" y="16" class="font-mono" font-size="8.5" font-weight="700" fill="#C66143" text-anchor="middle">⌥P</text>
    </g>

    <!-- Action Pill 2: App Preview -->
    <g transform="translate(548, 18)">
      <rect width="116" height="25" rx="12.5" fill="#E4E0D6" stroke="#D2CEC2" stroke-width="1"/>
      <text x="10" y="16" class="font-ui" font-size="11">⚡</text>
      <text x="28" y="16" class="font-ui" font-size="10.5" font-weight="600" fill="#141413">App Preview</text>
      <circle cx="102" cy="12.5" r="3" fill="#2E8B46"/>
    </g>

    <!-- Action Pill 3: Tema Toggle -->
    <g transform="translate(676, 18)">
      <rect width="78" height="25" rx="12.5" fill="#E4E0D6" stroke="#D2CEC2" stroke-width="1"/>
      <text x="10" y="16" class="font-ui" font-size="11">◐</text>
      <text x="28" y="16" class="font-ui" font-size="10.5" font-weight="500" fill="#44413B">Tema</text>
    </g>

    <!-- WINDOWS NATIVE WINDOW CONTROLS (Top Right: - □ ✕) -->
    <g transform="translate(860, 10)">
      <!-- Minimize button -->
      <g transform="translate(0, 0)">
        <rect width="40" height="32" fill="transparent"/>
        <line x1="14" y1="21" x2="26" y2="21" stroke="#5A564E" stroke-width="1.2"/>
      </g>
      <!-- Maximize button -->
      <g transform="translate(40, 0)">
        <rect width="40" height="32" fill="transparent"/>
        <rect x="15" y="11" width="10" height="10" fill="none" stroke="#5A564E" stroke-width="1.2"/>
      </g>
      <!-- Close button -->
      <g transform="translate(80, 0)">
        <rect width="40" height="32" fill="transparent"/>
        <line x1="15" y1="11" x2="25" y2="21" stroke="#5A564E" stroke-width="1.2"/>
        <line x1="25" y1="11" x2="15" y2="21" stroke="#5A564E" stroke-width="1.2"/>
      </g>
    </g>


    <!-- ========================================================================= -->
    <!-- LEFT SIDEBAR -->
    <!-- ========================================================================= -->
    <g transform="translate(10, 52)">
      <rect width="180" height="498" fill="#F0EEE6" stroke="#E2DFD6" stroke-width="1"/>

      <!-- SIDEBAR TOP: Terracotta Star, Title 'Claude Code', Edition Badge 'Desktop' -->
      <g transform="translate(16, 16)">
        <!-- Terracotta Star ✻ -->
        <g transform="translate(10, 12) scale(0.7)" fill="#D97757">
          <rect x="-2" y="-14" width="4" height="28" rx="2"/>
          <rect x="-14" y="-2" width="28" height="4" rx="2"/>
          <rect x="-2" y="-14" width="4" height="28" rx="2" transform="rotate(45)"/>
          <rect x="-2" y="-14" width="4" height="28" rx="2" transform="rotate(-45)"/>
        </g>
        <!-- Title 'Claude Code' -->
        <text x="24" y="17" class="font-ui" font-size="14" font-weight="700" fill="#141413" letter-spacing="-0.01em">
          Claude Code
        </text>
        <!-- Edition Badge 'Desktop' -->
        <g transform="translate(108, 3)">
          <rect width="44" height="18" rx="4" fill="#F6ECE7" stroke="#E6A691" stroke-width="0.8"/>
          <text x="22" y="12.5" class="font-mono" font-size="8" font-weight="700" fill="#C66143" text-anchor="middle">DESKTOP</text>
        </g>
      </g>

      <!-- New Chat Button -->
      <g transform="translate(14, 52)">
        <rect width="152" height="30" rx="6" fill="#E2DFD4" stroke="#D2CEC2" stroke-width="0.8"/>
        <text x="14" y="20" class="font-ui" font-size="11" font-weight="600" fill="#141413">+ New Session</text>
        <rect x="118" y="7" width="24" height="16" rx="3" fill="#D7D3C6"/>
        <text x="130" y="18.5" class="font-mono" font-size="8" fill="#5A564E" text-anchor="middle">⌘N</text>
      </g>

      <!-- Sidebar Divider -->
      <line x1="14" y1="96" x2="166" y2="96" stroke="#E2DFD6" stroke-width="1"/>

      <!-- Section: RECENTS -->
      <text x="16" y="118" class="font-mono" font-size="9" font-weight="700" fill="#8C887F" letter-spacing="0.08em">RECENTS</text>

      <g transform="translate(14, 128)">
        <rect width="152" height="26" rx="5" fill="#F6ECE7" stroke="#E6A691" stroke-width="0.8"/>
        <text x="8" y="17" class="font-ui" font-size="10.5">📁</text>
        <text x="24" y="17" class="font-mono" font-size="9.5" font-weight="600" fill="#141413">src/plugin.ts</text>
      </g>

      <g transform="translate(14, 158)">
        <text x="8" y="17" class="font-ui" font-size="10.5">🎨</text>
        <text x="24" y="17" class="font-mono" font-size="9.5" fill="#5A564E">claude-desktop.css</text>
      </g>

      <g transform="translate(14, 184)">
        <text x="8" y="17" class="font-ui" font-size="10.5">⚙️</text>
        <text x="24" y="17" class="font-mono" font-size="9.5" fill="#5A564E">cordis.yml</text>
      </g>

      <g transform="translate(14, 210)">
        <text x="8" y="17" class="font-ui" font-size="10.5">📄</text>
        <text x="24" y="17" class="font-mono" font-size="9.5" fill="#5A564E">README.md</text>
      </g>

      <!-- Section: ENGINE SESSIONS -->
      <text x="16" y="256" class="font-mono" font-size="9" font-weight="700" fill="#8C887F" letter-spacing="0.08em">ENGINE</text>

      <g transform="translate(14, 266)">
        <rect width="152" height="28" rx="5" fill="#E8E4DA" stroke="#D7D2C4" stroke-width="0.8"/>
        <circle cx="12" cy="14" r="3" fill="#2E8B46"/>
        <text x="22" y="18" class="font-ui" font-size="10" font-weight="600" fill="#141413">DeepSeek-V3 (dsh)</text>
      </g>

      <!-- Bottom Settings & Status -->
      <line x1="14" y1="440" x2="166" y2="440" stroke="#E2DFD6" stroke-width="1"/>
      <g transform="translate(16, 456)">
        <text x="0" y="14" class="font-ui" font-size="12">⚙️</text>
        <text x="20" y="14" class="font-ui" font-size="11" font-weight="500" fill="#141413">Settings</text>
        <text x="148" y="14" class="font-mono" font-size="8.5" fill="#8C887F" text-anchor="end">v0.1.0</text>
      </g>
    </g>


    <!-- ========================================================================= -->
    <!-- CENTER HERO WORKSPACE -->
    <!-- ========================================================================= -->
    <g transform="translate(190, 52)">
      <rect width="450" height="498" fill="#FAF9F5"/>

      <!-- Centered Hero Visual Composition -->
      <g transform="translate(225, 96)">
        
        <!-- Large Terracotta Star ✻ -->
        <g transform="translate(0, 0)">
          <!-- Star Backing Radial Glow in Light -->
          <circle cx="0" cy="0" r="48" fill="#D97757" fill-opacity="0.10" filter="url(#star-glow-hero-light)"/>
          <circle cx="0" cy="0" r="36" fill="none" stroke="#D97757" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 3"/>

          <!-- 8-petal vector Claude star -->
          <g transform="scale(1.05)" fill="#D97757">
            <rect x="-3" y="-28" width="6" height="56" rx="3"/>
            <rect x="-28" y="-3" width="56" height="6" rx="3"/>
            <rect x="-3" y="-28" width="6" height="56" rx="3" transform="rotate(45)"/>
            <rect x="-3" y="-28" width="6" height="56" rx="3" transform="rotate(-45)"/>
            <circle cx="0" cy="0" r="5" fill="#FAF9F5"/>
          </g>
        </g>

        <!-- Title: 'Claude Code' in Newsreader serif -->
        <text x="0" y="68" class="font-editorial" font-size="34" font-weight="600" fill="#141413" text-anchor="middle" letter-spacing="-0.02em">
          Claude Code
        </text>

        <!-- Subtitle: 'What can I help you build today?' -->
        <text x="0" y="96" class="font-editorial" font-size="16.5" font-style="italic" fill="#5A564E" text-anchor="middle">
          What can I help you build today?
        </text>

        <!-- Suggestion Chips Grid (2 Cards in Paper Light) -->
        <g transform="translate(-195, 126)">
          <!-- Suggestion 1 -->
          <rect width="190" height="50" rx="8" fill="#F3F1E9" stroke="#E2DFD4" stroke-width="0.8"/>
          <text x="12" y="22" class="font-ui" font-size="10.5" font-weight="600" fill="#141413">⚡ Inspect Cordis plugin</text>
          <text x="12" y="38" class="font-mono" font-size="8.5" fill="#7A756D">apply(ctx) lifecycle hooks</text>

          <!-- Suggestion 2 -->
          <g transform="translate(200, 0)">
            <rect width="190" height="50" rx="8" fill="#F3F1E9" stroke="#E2DFD4" stroke-width="0.8"/>
            <text x="12" y="22" class="font-ui" font-size="10.5" font-weight="600" fill="#141413">🛡️ Toggle Plan Mode</text>
            <text x="12" y="38" class="font-mono" font-size="8.5" fill="#7A756D">Press Shift + Tab</text>
          </g>
        </g>
      </g>

      <!-- FLOATING CAPSULE COMPOSER (Warm Paper #FFFFFF / #F3F1E9, Rounded 20px, Terracotta Send Button) -->
      <g transform="translate(20, 400)" filter="url(#composer-shadow-light)">
        <!-- Capsule Body -->
        <rect width="410" height="54" rx="20" fill="#FFFFFF" stroke="#DCD8CD" stroke-width="1.2"/>
        
        <!-- Inner Attachment Icon -->
        <g transform="translate(18, 17)">
          <circle cx="10" cy="10" r="10" fill="#F0EEE6"/>
          <text x="10" y="14" class="font-ui" font-size="11" text-anchor="middle" fill="#5A564E">+</text>
        </g>

        <!-- Placeholder Input Text -->
        <text x="48" y="33" class="font-ui" font-size="12.5" fill="#7A756D">
          Ask Claude Code to build, refactor, or test...
        </text>

        <!-- Model indicator mini pill -->
        <rect x="306" y="16" width="50" height="22" rx="4" fill="#F5F3EB" stroke="#DDD9CE" stroke-width="0.8"/>
        <text x="331" y="30.5" class="font-mono" font-size="8.5" fill="#C66143" text-anchor="middle">3.7 Son</text>

        <!-- Terracotta Send Button (Circle with White Arrow Up) -->
        <g transform="translate(362, 10)">
          <circle cx="17" cy="17" r="17" fill="#D97757"/>
          <!-- White Arrow Up Vector -->
          <path d="M 17 10 L 11 17 H 15 V 23 H 19 V 17 H 23 Z" fill="#FAF9F5"/>
        </g>
      </g>
    </g>


    <!-- ========================================================================= -->
    <!-- RIGHT DRAWER: SLIDE-OUT LIVE PREVIEW PANEL (460px in Paper Light) -->
    <!-- ========================================================================= -->
    <g transform="translate(640, 52)">
      <!-- Drawer Background -->
      <rect width="350" height="498" fill="#EDEAE1" stroke="#DDD9CE" stroke-width="1"/>

      <!-- Drawer Header Bar -->
      <g transform="translate(16, 14)">
        <text x="0" y="14" class="font-ui" font-size="12" font-weight="700" fill="#141413">Live App Preview</text>
        <rect x="114" y="1" width="50" height="18" rx="4" fill="#F6ECE7" stroke="#E6A691" stroke-width="0.8"/>
        <text x="139" y="13" class="font-mono" font-size="8.5" font-weight="700" fill="#C66143" text-anchor="middle">460px</text>

        <!-- Close / collapse icon -->
        <text x="312" y="14" class="font-ui" font-size="12" fill="#7A756D" text-anchor="end">✕</text>
      </g>

      <!-- URL Address Bar -->
      <g transform="translate(16, 40)">
        <rect width="318" height="28" rx="6" fill="#FBF9F4" stroke="#D5D1C5" stroke-width="1"/>
        <circle cx="14" cy="14" r="3" fill="#2E8B46"/>
        <text x="24" y="18" class="font-mono" font-size="10" fill="#141413">http://localhost:3000</text>
        <text x="278" y="18" class="font-mono" font-size="11" fill="#7A756D">↻  ↗</text>
      </g>

      <!-- Viewport Canvas Frame -->
      <g transform="translate(16, 78)">
        <rect width="318" height="394" rx="8" fill="#F7F5EE" stroke="#DBD7CD" stroke-width="1"/>

        <!-- Mini App Topbar -->
        <rect width="318" height="32" rx="8" fill="#ECE9E0"/>
        <rect x="0" y="20" width="318" height="12" fill="#ECE9E0"/>
        <line x1="0" y1="32" x2="318" y2="32" stroke="#DBD7CD" stroke-width="1"/>
        <text x="12" y="20" class="font-ui" font-size="10" font-weight="700" fill="#141413">⚡ Next.js Analytics App</text>
        <rect x="238" y="7" width="68" height="18" rx="4" fill="#FAF9F5" stroke="#DDD9CE" stroke-width="0.8"/>
        <text x="272" y="19" class="font-mono" font-size="8" fill="#1E7A38" text-anchor="middle">● Live (HMR)</text>

        <!-- KPI Metric Cards -->
        <g transform="translate(10, 44)">
          <rect width="144" height="60" rx="6" fill="#FFFFFF" stroke="#E0DDD3" stroke-width="1"/>
          <text x="10" y="16" class="font-ui" font-size="8.5" fill="#7A756D">Active Requests</text>
          <text x="10" y="36" class="font-mono" font-size="15" font-weight="700" fill="#141413">14,280</text>
          <text x="10" y="50" class="font-mono" font-size="8" fill="#1E7A38">▲ +18.4% today</text>

          <g transform="translate(154, 0)">
            <rect width="144" height="60" rx="6" fill="#FFFFFF" stroke="#E0DDD3" stroke-width="1"/>
            <text x="10" y="16" class="font-ui" font-size="8.5" fill="#7A756D">Avg Latency</text>
            <text x="10" y="36" class="font-mono" font-size="15" font-weight="700" fill="#C66143">24.2ms</text>
            <text x="10" y="50" class="font-mono" font-size="8" fill="#1E7A38">▼ -3.1ms</text>
          </g>
        </g>

        <!-- Live Waveform Chart -->
        <g transform="translate(10, 116)">
          <rect width="298" height="110" rx="6" fill="#FFFFFF" stroke="#E0DDD3" stroke-width="1"/>
          <text x="12" y="18" class="font-ui" font-size="9" font-weight="600" fill="#141413">Traffic Throughput (req/s)</text>

          <!-- Bars -->
          <rect x="14" y="60" width="14" height="38" rx="2" fill="#E8967D" opacity="0.65"/>
          <rect x="36" y="44" width="14" height="54" rx="2" fill="#D97757" opacity="0.75"/>
          <rect x="58" y="35" width="14" height="63" rx="2" fill="#D97757"/>
          <rect x="80" y="50" width="14" height="48" rx="2" fill="#D97757" opacity="0.7"/>
          <rect x="102" y="28" width="14" height="70" rx="2" fill="#D97757"/>
          <rect x="124" y="38" width="14" height="60" rx="2" fill="#D97757" opacity="0.8"/>
          <rect x="146" y="22" width="14" height="76" rx="2" fill="#C66143"/>
          <rect x="168" y="30" width="14" height="68" rx="2" fill="#D97757"/>
          <rect x="190" y="45" width="14" height="53" rx="2" fill="#D97757" opacity="0.7"/>
          <rect x="212" y="20" width="14" height="78" rx="2" fill="#C66143"/>
          <rect x="234" y="32" width="14" height="66" rx="2" fill="#D97757"/>
          <rect x="256" y="25" width="14" height="73" rx="2" fill="#D97757"/>

          <line x1="10" y1="98" x2="288" y2="98" stroke="#E2DFD6" stroke-width="1"/>
        </g>

        <!-- Live Telemetry List -->
        <g transform="translate(10, 238)">
          <rect width="298" height="136" rx="6" fill="#FFFFFF" stroke="#E0DDD3" stroke-width="1"/>
          <text x="12" y="20" class="font-ui" font-size="9" font-weight="600" fill="#141413">Recent Telemetry</text>
          
          <text x="12" y="46" class="font-mono" font-size="8.5" fill="#1E7A38">GET /api/v1/sessions [200 OK]</text>
          <text x="286" y="46" class="font-mono" font-size="8.5" fill="#7A756D" text-anchor="end">12ms</text>

          <text x="12" y="68" class="font-mono" font-size="8.5" fill="#1E7A38">POST /api/cordis/apply [201 OK]</text>
          <text x="286" y="68" class="font-mono" font-size="8.5" fill="#7A756D" text-anchor="end">48ms</text>

          <text x="12" y="90" class="font-mono" font-size="8.5" fill="#C66143">PATCH /theme/toggle [200 OK]</text>
          <text x="286" y="90" class="font-mono" font-size="8.5" fill="#7A756D" text-anchor="end">8ms</text>

          <text x="12" y="112" class="font-mono" font-size="8.5" fill="#1E7A38">GET /live-reload/hmr [101 UP]</text>
          <text x="286" y="112" class="font-mono" font-size="8.5" fill="#7A756D" text-anchor="end">1ms</text>
        </g>
      </g>
    </g>

  </g>
</svg>
