          <text x="10" y="18" class="font-ui" font-size="11">📦</text>
          <text x="28" y="18" class="font-ui" font-size="11" font-weight="500" fill="#5A564E">Artefactos</text>
          <text x="140" y="18" class="font-mono" font-size="9" fill="#7A756D" text-anchor="end">8</text>
