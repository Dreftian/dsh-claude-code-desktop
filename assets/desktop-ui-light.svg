          <rect x="36" y="44" width="14" height="54" rx="2" fill="#D97757" opacity="0.75"/>
          <rect x="58" y="35" width="14" height="63" rx="2" fill="#D97757"/>
          <rect x="80" y="50" width="14" height="48" rx="2" fill="#D97757" opacity="0.7"/>
          <rect x="102" y="28" width="14" height="70" rx="2" fill="#D97757"/>
          <rect x="124" y="38" width="14" height="60" rx="2" fill="#D97757" opacity="0.8"/>
          <rect x="146" y="22" width="14" height="76" rx="2" fill="#C66143"/>
