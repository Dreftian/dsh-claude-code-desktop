      <rect width="108" height="25" rx="12.5" fill="#E2DFD4" stroke="#D2CEC2" stroke-width="0.8"/>
      <circle cx="12" cy="12.5" r="3" fill="#D97757"/>
      <text x="22" y="16.5" class="font-mono" font-size="10" fill="#5A564E">dsh · workspace</text>
    </g>

    <g transform="translate(318, 18)">
      <rect width="108" height="25" rx="12.5" fill="#F6ECE7" stroke="#D97757" stroke-width="1.2"/>
