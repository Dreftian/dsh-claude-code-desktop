          <text x="10" y="18" class="font-ui" font-size="11">📁</text>
          <text x="28" y="18" class="font-ui" font-size="11" font-weight="600" fill="#141413">Proyectos</text>
          <text x="140" y="18" class="font-mono" font-size="9" fill="#7A756D" text-anchor="end">3</text>
        </g>

