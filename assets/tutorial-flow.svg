<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad-tutorial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D1C1B"/>
      <stop offset="50%" stop-color="#191918"/>
      <stop offset="100%" stop-color="#141413"/>
    </linearGradient>

    <radialGradient id="glow-card-4" cx="860" cy="220" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern-tut" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FAF9F5" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="arrow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-ui { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-editorial { font-family: 'Newsreader', Georgia, 'Times New Roman', serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  </style>

  <!-- Base Canvas -->
  <rect width="1000" height="380" rx="16" fill="url(#bg-grad-tutorial)"/>
  <rect width="1000" height="380" rx="16" fill="url(#glow-card-4)"/>
  <rect width="1000" height="380" rx="16" fill="url(#grid-pattern-tut)"/>
  <rect x="1" y="1" width="998" height="378" rx="15" fill="none" stroke="#FAF9F5" stroke-opacity="0.09" stroke-width="1.2"/>

  <!-- Header Section -->
  <g transform="translate(36, 26)">
    <!-- Small Eyebrow -->
    <rect width="176" height="22" rx="11" fill="#D97757" fill-opacity="0.12" stroke="#D97757" stroke-opacity="0.3" stroke-width="1"/>
    <text x="10" y="15" class="font-mono" font-size="10" font-weight="700" fill="#E8967D" letter-spacing="0.08em">QUICKSTART LIFECYCLE</text>

    <!-- Header Title -->
    <text x="0" y="46" class="font-ui" font-size="20" font-weight="700" fill="#FAF9F5" letter-spacing="-0.02em">
      From Installation to Editorial Desktop GUI in 4 Steps
    </text>

    <!-- Subtitle -->
    <text x="560" y="46" class="font-editorial" font-size="14.5" font-style="italic" fill="#A8A49A">
      Automated injection via Cordis microkernel into dsh web runtime
    </text>
  </g>

  <!-- ==================== STEP CARDS ==================== -->

  <!-- CARD 1: Install Plugin -->
  <g transform="translate(36, 86)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="206" height="264" rx="12" fill="#21201E" stroke="#353430" stroke-width="1"/>
    
    <!-- Step Header -->
    <rect x="14" y="14" width="62" height="20" rx="5" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-opacity="0.3" stroke-width="1"/>
    <text x="45" y="28" class="font-mono" font-size="10" font-weight="700" fill="#E8967D" text-anchor="middle">STEP 01</text>
    
    <text x="14" y="54" class="font-ui" font-size="16" font-weight="700" fill="#FAF9F5">Install Plugin</text>
    <text x="14" y="70" class="font-ui" font-size="11" fill="#A39F95">Register into dsh profile</text>

    <!-- Terminal Box -->
    <rect x="12" y="84" width="182" height="132" rx="8" fill="#141413" stroke="#2B2A27" stroke-width="1"/>
    <!-- Terminal Header dots -->
    <circle cx="24" cy="96" r="3" fill="#ED6A5E" opacity="0.8"/>
    <circle cx="32" cy="96" r="3" fill="#F5BF4F" opacity="0.8"/>
    <circle cx="40" cy="96" r="3" fill="#62C554" opacity="0.8"/>
    <text x="180" y="98" class="font-mono" font-size="9" fill="#65625B" text-anchor="end">bash</text>
    <line x1="12" y1="106" x2="194" y2="106" stroke="#22211F" stroke-width="1"/>

    <!-- Terminal Text -->
    <text x="20" y="124" class="font-mono" font-size="10" font-weight="600" fill="#D97757">$ dsh plugin</text>
    <text x="28" y="138" class="font-mono" font-size="9.5" fill="#C4C0B5">--profile web</text>
    <text x="28" y="152" class="font-mono" font-size="9.5" fill="#C4C0B5">add https://github</text>
    <text x="28" y="166" class="font-mono" font-size="9.5" fill="#C4C0B5">.com/Dreftian/dsh-</text>
    <text x="28" y="180" class="font-mono" font-size="9.5" fill="#D97757">claude-code-desktop</text>

    <text x="20" y="202" class="font-mono" font-size="9" fill="#52AD68">✔ added to manifest</text>

    <!-- Bottom Pill -->
    <rect x="12" y="226" width="182" height="24" rx="6" fill="#191918" stroke="#2E2D2A" stroke-width="1"/>
    <text x="103" y="242" class="font-mono" font-size="9.5" fill="#A39F95" text-anchor="middle">cordis.yml / registry</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(244, 214)" filter="url(#arrow-glow)">
    <circle cx="16" cy="0" r="14" fill="#242321" stroke="#3D3B37" stroke-width="1"/>
    <path d="M 12 -4 L 18 0 L 12 4" stroke="#D97757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CARD 2: Start Harness -->
  <g transform="translate(278, 86)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="206" height="264" rx="12" fill="#21201E" stroke="#353430" stroke-width="1"/>
    
    <!-- Step Header -->
    <rect x="14" y="14" width="62" height="20" rx="5" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-opacity="0.3" stroke-width="1"/>
    <text x="45" y="28" class="font-mono" font-size="10" font-weight="700" fill="#E8967D" text-anchor="middle">STEP 02</text>
    
    <text x="14" y="54" class="font-ui" font-size="16" font-weight="700" fill="#FAF9F5">Start Harness</text>
    <text x="14" y="70" class="font-ui" font-size="11" fill="#A39F95">Launch web runtime</text>

    <!-- Terminal Box -->
    <rect x="12" y="84" width="182" height="132" rx="8" fill="#141413" stroke="#2B2A27" stroke-width="1"/>
    <!-- Terminal Header dots -->
    <circle cx="24" cy="96" r="3" fill="#ED6A5E" opacity="0.8"/>
    <circle cx="32" cy="96" r="3" fill="#F5BF4F" opacity="0.8"/>
    <circle cx="40" cy="96" r="3" fill="#62C554" opacity="0.8"/>
    <text x="180" y="98" class="font-mono" font-size="9" fill="#65625B" text-anchor="end">bash</text>
    <line x1="12" y1="106" x2="194" y2="106" stroke="#22211F" stroke-width="1"/>

    <!-- Terminal Text -->
    <text x="20" y="124" class="font-mono" font-size="10" font-weight="600" fill="#D97757">$ dsh web</text>
    <text x="20" y="142" class="font-mono" font-size="9.5" fill="#65625B"># or with npx:</text>
    <text x="20" y="158" class="font-mono" font-size="9.5" fill="#FAF9F5">$ npx @deepseek-ai</text>
    <text x="28" y="172" class="font-mono" font-size="9.5" fill="#FAF9F5">/dsh web</text>

    <text x="20" y="196" class="font-mono" font-size="9" fill="#52AD68">✔ server initialized</text>

    <!-- Bottom Pill -->
    <rect x="12" y="226" width="182" height="24" rx="6" fill="#191918" stroke="#2E2D2A" stroke-width="1"/>
    <text x="103" y="242" class="font-mono" font-size="9.5" fill="#A39F95" text-anchor="middle">runtime: node / dsh</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(486, 214)" filter="url(#arrow-glow)">
    <circle cx="16" cy="0" r="14" fill="#242321" stroke="#3D3B37" stroke-width="1"/>
    <path d="M 12 -4 L 18 0 L 12 4" stroke="#D97757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CARD 3: Cordis Mounts apply(ctx) -->
  <g transform="translate(520, 86)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="206" height="264" rx="12" fill="#21201E" stroke="#353430" stroke-width="1"/>
    
    <!-- Step Header -->
    <rect x="14" y="14" width="62" height="20" rx="5" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-opacity="0.3" stroke-width="1"/>
    <text x="45" y="28" class="font-mono" font-size="10" font-weight="700" fill="#E8967D" text-anchor="middle">STEP 03</text>
    
    <text x="14" y="54" class="font-ui" font-size="16" font-weight="700" fill="#FAF9F5">Cordis Mount</text>
    <text x="14" y="70" class="font-ui" font-size="11" fill="#A39F95">apply(ctx) injects UI</text>

    <!-- Code Box -->
    <rect x="12" y="84" width="182" height="132" rx="8" fill="#141413" stroke="#2B2A27" stroke-width="1"/>
    <!-- Terminal Header dots -->
    <circle cx="24" cy="96" r="3" fill="#ED6A5E" opacity="0.8"/>
    <circle cx="32" cy="96" r="3" fill="#F5BF4F" opacity="0.8"/>
    <circle cx="40" cy="96" r="3" fill="#62C554" opacity="0.8"/>
    <text x="180" y="98" class="font-mono" font-size="9" fill="#65625B" text-anchor="end">plugin.ts</text>
    <line x1="12" y1="106" x2="194" y2="106" stroke="#22211F" stroke-width="1"/>

    <!-- Code Text -->
    <text x="20" y="123" class="font-mono" font-size="9.5" fill="#E8967D">apply(ctx: Context) {</text>
    <text x="28" y="139" class="font-mono" font-size="9" fill="#52AD68">✔ injectCSS(tokens)</text>
    <text x="28" y="155" class="font-mono" font-size="9" fill="#52AD68">✔ registerDrawer()</text>
    <text x="28" y="171" class="font-mono" font-size="9" fill="#52AD68">✔ bindKeys('Shift+Tab')</text>
    <text x="20" y="187" class="font-mono" font-size="9.5" fill="#E8967D">}</text>
    <text x="20" y="203" class="font-mono" font-size="8.5" fill="#7D7971">// DOM observers live</text>

    <!-- Bottom Pill -->
    <rect x="12" y="226" width="182" height="24" rx="6" fill="#191918" stroke="#2E2D2A" stroke-width="1"/>
    <text x="103" y="242" class="font-mono" font-size="9.5" fill="#E8967D" text-anchor="middle">lifecycle: apply(ctx)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(728, 214)" filter="url(#arrow-glow)">
    <circle cx="16" cy="0" r="14" fill="#242321" stroke="#3D3B37" stroke-width="1"/>
    <path d="M 12 -4 L 18 0 L 12 4" stroke="#D97757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CARD 4: Claude Code Desktop GUI Ready -->
  <g transform="translate(762, 86)" filter="url(#card-shadow)">
    <!-- Card Frame (Highlighted with Terracotta active border) -->
    <rect width="206" height="264" rx="12" fill="#242220" stroke="#D97757" stroke-width="1.6"/>
    
    <!-- Step Header -->
    <rect x="14" y="14" width="62" height="20" rx="5" fill="#D97757" fill-opacity="0.25" stroke="#D97757" stroke-opacity="0.6" stroke-width="1"/>
    <text x="45" y="28" class="font-mono" font-size="10" font-weight="700" fill="#F4957A" text-anchor="middle">STEP 04</text>
    
    <text x="14" y="54" class="font-ui" font-size="16" font-weight="700" fill="#FAF9F5">Workstation GUI</text>
    <text x="14" y="70" class="font-ui" font-size="11" fill="#E8967D">Claude Code Experience</text>

    <!-- Output Box -->
    <rect x="12" y="84" width="182" height="132" rx="8" fill="#171615" stroke="#3D3A35" stroke-width="1"/>
    <!-- Terminal Header dots -->
    <circle cx="24" cy="96" r="3" fill="#ED6A5E" opacity="0.8"/>
    <circle cx="32" cy="96" r="3" fill="#F5BF4F" opacity="0.8"/>
    <circle cx="40" cy="96" r="3" fill="#62C554" opacity="0.8"/>
    <text x="180" y="98" class="font-mono" font-size="9" fill="#52AD68" text-anchor="end">READY</text>
    <line x1="12" y1="106" x2="194" y2="106" stroke="#252422" stroke-width="1"/>

    <!-- URL and status -->
    <text x="20" y="125" class="font-mono" font-size="9" fill="#A39F95">Server live at:</text>
    <text x="20" y="141" class="font-mono" font-size="10.5" font-weight="700" fill="#FAF9F5">http://127.0.0.1</text>
    <text x="20" y="157" class="font-mono" font-size="10.5" font-weight="700" fill="#D97757">:3080</text>

    <!-- Mini Features in GUI -->
    <g transform="translate(20, 172)">
      <rect width="142" height="18" rx="4" fill="#24221F" stroke="#383632" stroke-width="0.8"/>
      <text x="6" y="13" class="font-ui" font-size="8.5" fill="#FAF9F5">🛡️ Plan Mode</text>
      <text x="82" y="13" class="font-mono" font-size="8" fill="#52AD68">Active</text>
    </g>

    <text x="20" y="206" class="font-mono" font-size="8.5" fill="#7D7971">⚡ 460px Drawer Ready</text>

    <!-- Bottom Pill -->
    <rect x="12" y="226" width="182" height="24" rx="6" fill="#D97757" fill-opacity="0.18" stroke="#D97757" stroke-opacity="0.4" stroke-width="1"/>
    <text x="103" y="242" class="font-ui" font-size="10" font-weight="600" fill="#FAF9F5" text-anchor="middle">Open in Browser ↗</text>
  </g>

</svg>
